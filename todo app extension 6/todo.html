<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App Extension</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-width: 350px;
            min-height: 100vh;
            background: #0f172a;
            padding: 20px;
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        #inputs {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
        }

        #inputs p {
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 10px;
            border: none;
            outline: none;
            border-radius: 8px;
            background: #334155;
            color: white;
            font-size: 14px;
        }

        input::placeholder {
            color: #94a3b8;
        }

        #addBtn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #addBtn:hover {
            background: #0ea5e9;
        }

        #todoContent {
            margin-top: 20px;
        }

        .todoCard {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }

        .todoCard h3 {
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .todoCard p {
            color: #cbd5e1;
            margin-bottom: 15px;
            word-wrap: break-word;
        }

        .btns {
            display: flex;
            gap: 10px;
        }

        .deleteBtn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .deleteBtn:hover {
            background: #dc2626;
        }

        .updateBtn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .updateBtn:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>
    <div>
        <div id="inputs">
            <h1>Todo App</h1>
            <p>Heading of todo</p>
            <input type="text" id="headingInp">
            <p>Text todo</p>
            <input type="text" id="todoTextInp">
            <br><br>
            <button id="addBtn">Add Todo</button>
        </div>
        <div id="todoDisp">
            <div id="todoContent"></div>
        </div>
    </div>
    <script src="todo.js"></script>
</body>

</html>

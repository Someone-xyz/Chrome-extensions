<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Scale Converter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 550px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
            font-family: Arial, Helvetica, sans-serif;
        }

        #main {
            width: 400px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            color: white;
        }

        header h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            color: #f8fafc;
        }

        #container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        #number,
        #selection {
            width: 100%;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            transition: 0.3s;
        }

        #number::placeholder {
            color: #cbd5e1;
        }

        #number:focus,
        #selection:focus {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        #selection option {
            color: black;
        }

        #convert {
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #convert:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4);
        }

        #displayContent {
            min-height: 50px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <div id="main">

        <header>
            <h1>🌡 Temperature 🥵 Converter 🥶</h1>
        </header>

        <div id="container">

            <input type="number" id="number" placeholder="Enter temperature">

            <select id="selection">
                <option value="C to F">Celsius to Fahrenheit</option>
                <option value="F to C">Fahrenheit to Celsius</option>
                <option value="C to K">Celsius to Kelvin</option>
                <option value="F to K">Fahrenheit to Kelvin</option>
            </select>

            <button id="convert">Convert</button>

            <p id="displayContent">
                Result will appear here
            </p>

        </div>

        <footer>
            Made with ❤️ by Eeesaa
        </footer>

    </div>

    <script src="./temp.js"></script>
</body>

</html>

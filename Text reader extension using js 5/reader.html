<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reader Extension</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            width: 500px;
            padding: 15px;
            display: flex;
            gap: 15px;
            background: linear-gradient(135deg, #e0e7ff, #f8fafc);
        }

        .container {
            flex: 1;
            background: white;
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #1e293b;
            font-size: 24px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            resize: none;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.25);
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        button:active {
            transform: scale(0.98);
        }

        #speakBtn {
            background: #2563eb;
        }

        #stopBtn {
            background: #ef4444;
        }

        #pauseBtn {
            background: #f59e0b;
        }

        #playBtn {
            background: #10b981;
        }

        .note {
            margin-top: 12px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            font-weight: normal;
        }

        #inputs {
            width: 160px;
            background: white;
            padding: 15px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        #inputs p {
            margin-top: 12px;
            margin-bottom: 6px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        #inputs input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>📢 Text Reader</h2>
        <textarea id="textInput" placeholder="Type or paste text..."></textarea>
        <button id="speakBtn">▶ Speak</button>
        <button id="stopBtn">🛑 Stop</button>
        <button id="pauseBtn">⏸⏯ Pause</button>
        <button id="playBtn">▶ ⏯ Play</button>
        <h1 class="note">Select text → Right click → Read with extension</h1>

    </div>
    <div id="inputs">

        <p>Volume : </p>
        <input id="volume" type="range" min="0" max="1" step="0.1" value="1">

        <p>Pitch : </p>
        <input id="pitch" type="range" min="0" max="2" step="0.1" value="1">

        <p>Rate : </p>
        <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1">

    </div>
    <script src="reader.js"></script>

</body>

</html>
